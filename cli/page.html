<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pocketworld</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; display: grid; place-items: center; }
  canvas { image-rendering: pixelated; display: block; background: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { mount } from "/src/player.js";
const q = new URLSearchParams(location.search);
const scene = q.get("scene");
if (!scene) throw new Error("missing ?scene=");
const player = await mount(document.getElementById("c"), scene, {
  scale: +(q.get("scale") || 1),
  time: q.has("t") ? +q.get("t") : 0,
  autoplay: false,
  dither: !q.has("nodither"),
});
window.__player = player;
window.__ready = true;
window.setTime = (t) => player.setTime(t);
window.grab = (t) => player.grab(t);
window.info = () => player.info();
</script>
<script>
window.__ready = false;
window.isReady = () => window.__ready === true;
</script>
</body>
</html>
