name: Renderer parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - name: Install Chrome
        run: |
          node node_modules/@puppeteer/browsers/lib/cjs/main-cli.js install chrome@stable --path "$RUNNER_TEMP/pocketworld-chrome"
          echo "CHROME=$(find "$RUNNER_TEMP/pocketworld-chrome" -type f -path '*/chrome-linux64/chrome' | head -1)" >> "$GITHUB_ENV"
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - name: CPU / WebGL parity
        env:
          PYTHON: python
        run: node cli/pocketworld.js parity rain-bus-stop rooftop-laundry --times 0,1.5,3,11.983333333
      - name: Other motion categories
        env:
          PYTHON: python
        run: |
          python tests/motion_fixture.py "$RUNNER_TEMP/motion-fixture"
          node cli/pocketworld.js parity "$RUNNER_TEMP/motion-fixture" --times 0,1.5,7.4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-diffs
          path: |
            examples/*/build/parity/
            ${{ runner.temp }}/motion-fixture/build/parity/
