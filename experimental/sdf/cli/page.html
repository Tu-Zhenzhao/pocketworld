<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>pocketworld render</title>
  <style>
    html, body { margin: 0; background: #fff; }
    canvas { display: block; }
    pre { margin: 12px; color: #8a1e1e; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <pre id="err"></pre>
  <script type="module">
    import { mount } from "/src/player.js";
    const q = new URLSearchParams(location.search);
    const canvas = document.getElementById("c");
    const size = Number(q.get("size") || 720);
    canvas.width = canvas.height = size;
    try {
      const mod = await import(q.get("scene"));
      const player = mount(canvas, mod.default, {
        size,
        grid: q.get("grid") ? Number(q.get("grid")) : undefined,
        bayer: q.get("bayer") ? Number(q.get("bayer")) : undefined,
        autoplay: false,
        respectReducedMotion: false,
      });
      window.__player = player;
      window.renderFrame = (t) => {
        player.setTime(Number(t));
        return player.time;
      };
      window.__params = player.params;
      window.renderFrame(q.has("t") ? Number(q.get("t")) : (mod.default.poster || 0));
      window.__ready = true;
    } catch (err) {
      const text = String(err && (err.stack || err.message) || err);
      document.getElementById("err").textContent = text;
      console.error(text);
      window.__error = text;
      window.__ready = true;
    }
  </script>
</body>
</html>
