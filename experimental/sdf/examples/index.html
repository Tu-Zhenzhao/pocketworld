<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pocketworld — four loops</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #fff; color: #1c1915;
      font: 16px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
    }
    header { padding: 28px 28px 0; max-width: 980px; }
    h1 { font-weight: 500; font-size: 28px; margin: 0 0 6px; }
    header p { margin: 0; color: #5c564c; }
    header a { color: inherit; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px 22px;
      padding: 22px 28px 48px;
      max-width: 980px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    figure { margin: 0; }
    figcaption { margin-top: 8px; }
    figcaption b { font-weight: 500; }
    figcaption span { display: block; color: #5c564c; font-size: 14px; }
    pocket-world { display: block; width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Four small worlds</h1>
    <p>They loop. They pause when you scroll them off the page. The knobs live in the <a href="/playground/">playground</a>.</p>
  </header>
  <div class="grid">
    <figure>
      <pocket-world src="rain-bus-stop/scene.js"></pocket-world>
      <figcaption><b>Rain at the bus stop</b><span>Two people, and the rain doing all the moving.</span></figcaption>
    </figure>
    <figure>
      <pocket-world src="fishing/scene.js"></pocket-world>
      <figcaption><b>Fishing pier</b><span>A bite, a splash, and a kid who will not sit still.</span></figcaption>
    </figure>
    <figure>
      <pocket-world src="basketball/scene.js"></pocket-world>
      <figcaption><b>Driveway hoop</b><span>Eight bounces. The arm keeps count.</span></figcaption>
    </figure>
    <figure>
      <pocket-world src="juggler/scene.js"></pocket-world>
      <figcaption><b>Juggler</b><span>Three balls, one rug, no one drops anything.</span></figcaption>
    </figure>
  </div>
  <script type="module" src="/src/element.js"></script>
</body>
</html>
