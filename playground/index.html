<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pocketworld</title>
<style>
  :root { color: #243038; font: 16px/1.45 Georgia, "Iowan Old Style", serif; }
  body { margin: 0; background: #fff; }
  header { max-width: 880px; margin: 0 auto; padding: 28px 20px 0; }
  h1 { font-weight: 500; font-size: 28px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  a { color: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; max-width: 1100px; margin: 0 auto; padding: 12px 20px 48px; }
  figure { margin: 0; }
  figcaption { padding: 8px 2px 0; font-size: 15px; }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>pocketworld</h1>
  <p>A reference painting, rebuilt as a few dozen colours, then left to breathe. <a href="https://x.com/zzzzshawn">shawn</a> is the reason it looks like this.</p>
</header>
<div class="row">
  <figure>
    <pocket-world src="/examples/rain-bus-stop/build/manifest.json"></pocket-world>
    <figcaption>Rain at the bus stop. Twelve seconds, then it is twelve seconds again.</figcaption>
  </figure>
  <figure>
    <pocket-world src="/examples/rooftop-laundry/build/manifest.json"></pocket-world>
    <figcaption>Rooftop laundry. The sheets have the wind. The cat has a breath.</figcaption>
  </figure>
  <figure>
    <pocket-world src="/examples/chess-under-tree/build/manifest.json"></pocket-world>
    <figcaption>Chess under the tree. The leaves sway. The man fans himself.</figcaption>
  </figure>
  <figure>
    <pocket-world src="/examples/snow-campfire/build/manifest.json"></pocket-world>
    <figcaption>Campfire in the snow. The fire flickers. The dog rests.</figcaption>
  </figure>
</div>
<script type="module" src="/src/element.js"></script>
</body>
</html>
