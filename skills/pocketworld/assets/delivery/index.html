<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocketworld</title>
<style>
:root{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:#394436;background:white;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:30px 24px 42px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px}h1{font:500 29px "Songti SC",serif;letter-spacing:.1em;margin:0}header p{font-size:13px;color:#858d7b;margin:0}.stage{min-height:500px;display:flex;justify-content:center;align-items:center;gap:20px;margin:20px 0;overflow:hidden}.stage canvas{image-rendering:pixelated;display:block;flex:none}button,select{font:inherit;font-size:13px;color:#627455;background:transparent;border:0;padding:9px 12px;cursor:pointer;border-radius:4px}button:hover{background:#f0f4e9}button[aria-pressed=true]{background:#eaf0df;color:#455b34}button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #879d66;outline-offset:3px}.focus,.variants,.host-controls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.transport{display:flex;align-items:center;gap:16px;max-width:660px;margin:22px auto 0;padding-top:14px;border-top:1px solid #edf0e6}.transport input{flex:1;min-width:70px;accent-color:#899d67}output{font-size:12px;color:#87907e;min-width:60px}.note{text-align:center;font-size:12px;color:#828c79;line-height:1.8}.delivery{max-width:660px;margin:28px auto 0;padding-top:18px;border-top:1px solid #edf0e6}.format-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}.delivery a{color:#61784d;font-size:13px;text-decoration:none;border-bottom:1px solid #cddabd}details{max-width:660px;margin:25px auto 0;font-size:12px;color:#7a876e;line-height:1.9}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f1;padding:14px}footer{text-align:center;font-size:11px;color:#98a18e;margin-top:30px}[hidden]{display:none!important}.error{color:#a64d40}#request-text{width:100%;height:70px}label{font-size:13px}.stage.compare{min-height:360px}
@media(max-width:780px){main{padding:22px 16px}header{display:block}header p{margin-top:9px}.stage{min-height:360px}.stage.compare{gap:8px}}
@media(max-width:500px){h1{font-size:25px}.stage{min-height:300px}.transport{gap:6px}.stage.compare{flex-direction:column}.stage.compare{min-height:500px}}
</style>
<main><header><h1 id="title"></h1><p id="caption"></p></header>
<div class="variants" id="variants" aria-label="方案选择"></div>
<section class="stage" id="stage" aria-label="动画预览"><canvas id="view" aria-label="当前方案"></canvas><canvas id="compare-view" aria-label="对比方案" hidden></canvas></section>
<nav class="focus" id="focus" aria-label="观看范围"></nav>
<div class="transport"><button id="play" aria-pressed="true">暂停</button><input id="time" aria-label="时间" type="range" min="0" step="any" value="0"><output id="clock"></output><button id="reset">重播</button></div>
<div class="host-controls" aria-label="透明背景检查"><button data-bg="white" aria-pressed="true">白底</button><button data-bg="dark" aria-pressed="false">深底</button><button data-bg="color" aria-pressed="false">彩底</button></div>
<p class="note" id="stats"></p>
<section class="delivery" aria-label="交付方式"><div class="format-row"><label for="format">选择交付方式</label><select id="format"><option value="video">视频 MP4</option><option value="gif">GIF</option><option value="component">透明网页组件</option></select><a id="download" download hidden>下载</a><button id="request">复制交付需求</button></div><p class="note" id="format-note" aria-live="polite"></p><textarea id="request-text" aria-label="交付需求" readonly hidden></textarea></section>
<details><summary>开发者集成与场景信息</summary><p id="technical"></p><pre id="embed"></pre><p>组件需要 WebGL2；透明背景保留白色物体。独立组件使用 data: 模块；限制 data: 的 CSP 请改用随包附带的模块源文件。GIF 为二值透明、20 fps；MP4 为白底、不透明。</p><p><a href="manifest.json">交付清单</a> · <a href="poster.png" download>透明静帧</a></p></details>
<footer>Pocketworld · 小世界</footer></main>
<script type="module" src="app.js"></script></html>
